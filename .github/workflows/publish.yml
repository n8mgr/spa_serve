name: Publish

on:
  schedule:
    - cron: '00 00 * * *'
  push:
    branches: [master]

permissions:
  contents: write

# Serialize all runs so concurrent pushes can't race on the `:master` or release tags.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/main.yml
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        name: generate tags
        id: meta
        with:
          images: ghcr.io/n8mgr/spa_serve
          tags: |
            type=ref,event=branch
            type=sha,prefix=
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  release:
    needs: docker
    if: "contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.released.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
      - run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get released version
        id: released
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "version=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

  docker-latest:
    needs: [docker, release]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Retags the digest the docker job already built and pushed, so the released image is
      # bit-identical to the one CI tested.
      - name: Tag release image as latest and version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          VERSION="${VERSION#v}"
          docker buildx imagetools create \
            -t ghcr.io/n8mgr/spa_serve:latest \
            -t "ghcr.io/n8mgr/spa_serve:${VERSION}" \
            ghcr.io/n8mgr/spa_serve@${{ needs.docker.outputs.digest }}
